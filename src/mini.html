<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>JARVIS mini</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: 'Segoe UI', sans-serif; }
    body { display: flex; align-items: flex-end; justify-content: flex-end; padding: 8px; box-sizing: border-box; gap: 8px; }
    #orb { width: 116px; height: 116px; cursor: pointer; flex-shrink: 0; border-radius: 50%; }
    #bubble {
      align-self: center; max-width: 180px; max-height: 150px; overflow: hidden;
      background: rgba(var(--surface-rgb), 0.92); border: 1px solid rgba(var(--accent-rgb), 0.35); border-radius: 10px 10px 2px 10px;
      color: var(--text); font-size: 12.5px; line-height: 1.35; padding: 8px 10px;
      opacity: 0; transform: translateX(8px); transition: opacity .25s, transform .25s; pointer-events: none;
      display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical;
    }
    #bubble.show { opacity: 1; transform: none; }
    #focus { position: absolute; right: 8px; bottom: 2px; width: 116px; text-align: center; font: 600 11px Consolas, monospace; color: var(--amber); letter-spacing: 1px; text-shadow: 0 0 6px #000; pointer-events: none; }
  </style>
</head>
<body>
  <div id="bubble"></div>
  <canvas id="orb" title="Clique: falar · Duplo clique: abrir o JARVIS · Arraste para mover"></canvas>
  <div id="focus"></div>
  <script src="mini.js"></script>
</body>
</html>
