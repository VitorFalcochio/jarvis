<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 15 60 62">
  <!-- Só a fita da logo (para o centro do orb e tamanhos pequenos) -->
  <defs>
    <radialGradient id="jv-bg" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#121110"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <linearGradient id="jv-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121110"/>
      <stop offset=".4" stop-color="#3d3a35"/>
      <stop offset=".55" stop-color="#9a9184"/>
      <stop offset=".68" stop-color="#4a4640"/>
      <stop offset="1" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="jv-metal2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2725"/>
      <stop offset=".55" stop-color="#8a8174"/>
      <stop offset="1" stop-color="#161514"/>
    </linearGradient>
    <filter id="jv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g class="jv-ribbon">
    <!-- faixa de baixo (por trás) -->
    <path d="M30.5 63 C31 70.5 38 73.5 47 73.6 C57 73.7 66 72.8 73.5 70.6 C67 70.2 58 68.4 49 66.2 C41 64.2 35 64.6 30.5 63 Z" fill="url(#jv-metal2)"/>
    <!-- faixa da esquerda: do topo até a volta de baixo -->
    <path d="M47.5 25.5 C43 31 37 40.5 31.5 50 C26.5 58.5 28.5 67 36 70.5 C33.5 66 34 60.5 38.5 54.5 L55.5 31.5 C53.5 27 50.5 25 47.5 25.5 Z" fill="url(#jv-metal)"/>
    <!-- faixa larga da direita: do topo até a ponta -->
    <path d="M47.5 25.5 C52 17.5 63 17 67.5 27.5 C71 36 75 50 78.6 62.5 C79.8 67.5 77.5 71.5 73.5 70.6 C71 70 69.6 67.6 68.6 64.4 L59.8 34.6 C58.4 30 55.5 27.6 52 28 C50.4 28.2 49 28.4 47.5 25.5 Z" fill="url(#jv-metal)"/>
    <!-- volta interna (sobre a faixa da esquerda) -->
    <path d="M38.5 54.5 C44 58.5 52 62 60 64 C64 65 67 65.6 68.6 64.4 L69.4 67.4 C61 67.6 50 64.8 42 61.6 C38.5 60.2 37 57.5 38.5 54.5 Z" fill="#1b1a18"/>
    <!-- luz na borda interna -->
    <path d="M52 28 C55.5 27.6 58.4 30 59.8 34.6 L68.6 64.4" fill="none" stroke="#fff4e2" stroke-width=".7" stroke-linecap="round" filter="url(#jv-glow)"/>
    <path d="M40 58.4 C47 62.2 57 65.2 66.5 66.2" fill="none" stroke="#fff4e2" stroke-width=".5" stroke-opacity=".9" stroke-linecap="round" filter="url(#jv-glow)"/>
    <path d="M47.5 25.5 C52 17.5 63 17 67.5 27.5" fill="none" stroke="#e9d6b6" stroke-width=".35" stroke-opacity=".6"/>
  </g>
</svg>
